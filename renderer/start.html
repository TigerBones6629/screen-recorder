<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../shared/theme.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--muted);
        font-family: -apple-system, "Segoe UI", sans-serif;
      }
      .card {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 6px;
      }
      h1 {
        color: var(--text);
        font-size: 22px;
        margin: 0 0 4px;
      }
      p {
        font-size: 13px;
        margin: 0;
        max-width: 420px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Step Recorder</h1>
      <p>Browse to a site using the address bar above to capture a step guide.</p>
      <p>Screen and window recording work no matter what's shown here.</p>
    </div>
  </body>
</html>
